name: Publish to npm

# 推 v* tag 即发版,版本号以 tag 为准(workflow 会把 tag 版本写进 package.json 再发布)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm --provenance 签名

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${TAG} 不是合法 semver(期望 v1.2.3 或 v1.2.3-beta.1 形态)"
            exit 1
          fi
          VERSION="${TAG#v}"
          # --allow-same-version:package.json 与 tag 同版本时不算错(如首发 v0.1.0)
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing ${VERSION} (from tag ${TAG})"

      # 单测 + audit 纪律走查;纯 node:test/内置模块,无需安装依赖
      - name: Test gate
        run: npm test

      - name: Publish
        # npm provenance 仅支持公开仓库:私有仓库先普通发布,开源后自动带签名
        run: |
          if [[ "$REPO_PRIVATE" == "true" ]]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
